<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="PageForge Studio — a local-first visual website editor with Design, Split, Code and Preview views."><meta name="theme-color" content="#2866ad"><title>PageForge Studio</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232b66ab'/%3E%3Cpath d='M9 5h10l5 5v17H9z' fill='white'/%3E%3Cpath d='M13 14h7m-7 5h7m-7 4h5' stroke='%232b66ab' stroke-width='2'/%3E%3C/svg%3E"><style>:root{font-family:Tahoma,'Segoe UI',Arial,sans-serif;color:#263447;font-size:11px;--blue:#245caa;--blue-light:#e7effb;--border:#b9c3cf;--chrome:#f3f4f4;--muted:#79828e;--panel:#f9fafb;--title-top:#387dc5;--title-bottom:#235a9b;--pane-top:#e7edf6;--pane-bottom:#d4dfed;--active:#2f64ae;--workspace:#dfe5eb;--selection:#e2ebf9}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#e0e5ea}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #4385d7;outline-offset:1px}
button{border:0;background:none;padding:0}
input,select,textarea{border:1px solid #b7c3d0;border-radius:2px;background:white}
select{height:24px;padding:1px 22px 1px 6px}
input{height:26px;padding:4px 7px}
input[type=checkbox]{height:14px;width:14px;accent-color:#3474c3;vertical-align:middle}
input[type=color]{padding:2px}
.icon{width:17px;height:17px;flex:none;vertical-align:middle}
.app{height:100dvh;min-width:720px;display:flex;flex-direction:column}
.titlebar{height:35px;flex:none;background:linear-gradient(var(--title-top),var(--title-bottom));display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 8px;color:white;border-bottom:1px solid #194d86;box-shadow:inset 0 1px #ffffff30}
.app-brand{display:flex;align-items:center;gap:9px}
.app-logo{width:24px;height:24px;border-radius:4px;background:linear-gradient(#edf4ff,#b8d1ec);color:#245791;display:grid;place-items:center;box-shadow:0 1px 2px #13305d88}
.app-logo .icon{width:19px;height:19px}
.app-brand strong{font-family:'Segoe UI',Tahoma,sans-serif;letter-spacing:-.2px;font-size:14px}
.app-brand strong span{font-weight:400;color:#d8eaff}
.title-divider{height:16px;border-left:1px solid #ffffff44;margin:0 5px}
.app-brand>#project-title{font-size:11px;color:#e1eafa}
.title-right{display:flex;align-items:center;gap:13px}
.engine-badge{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.2px;border:1px solid #ffffff33;padding:3px 7px;border-radius:3px;background:#123d671c}
.engine-badge i{width:5px;height:5px;border-radius:50%;background:#b1f0bb;box-shadow:0 0 5px #b1f0bb55}
.title-button{color:#e3efff;display:flex;align-items:center}
.title-button:hover{color:#fff}
.menubar{height:27px;background:#f1f2f3;display:flex;align-items:center;padding:0 5px;border-bottom:1px solid #d2d7de;flex:none}
.menubar>button{height:23px;padding:0 10px;border:1px solid transparent}
.menubar>button:hover,.menubar>button.open{background:#dce8f8;border-color:#94b0d4}
.menu-spacer,.toolbar-stretch,.status-spacer{flex:1}
.workspace-label{color:#909ba8;font-size:9px;letter-spacing:1.4px;padding-right:11px}
.toolbar{height:34px;display:flex;align-items:center;gap:2px;padding:3px 9px 3px 4px;background:linear-gradient(#fafbfc,#e9ecf0);border-bottom:1px solid #bbc5d1;flex:none;overflow:hidden}
.grip{height:20px;width:5px;border-left:1px dotted #a8b3c1;border-right:1px dotted #fff;margin-right:3px;flex:none}
.tool{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:2px;flex:none;color:#44576e}
.tool:hover:not(:disabled),.tool.active{border-color:#9bb6d8;background:linear-gradient(#f5f9ff,#d6e4f7)}
.tool.active{box-shadow:inset 0 1px 3px #9eb7d04a}
.tool .icon{width:17px;height:17px}
.standard-toolbar [data-cmd=new]{color:#4283b0}
.standard-toolbar [data-cmd=import]{color:#aa853b}
.standard-toolbar [data-cmd=save]{color:#375f98}
.standard-toolbar [data-cmd=undo],.standard-toolbar [data-cmd=redo]{color:#719266}
.standard-toolbar [data-cmd=image]{color:#648b62}
.separator{width:1px;height:21px;background:#c0c9d3;border-right:1px solid white;margin:0 5px;flex:none}
.small-separator{height:17px;border-left:1px solid #d2d9e2;margin:0 7px}
.local-indicator{color:#667a66;font-size:10px;display:flex;gap:5px;align-items:center;white-space:nowrap;margin-right:14px}
.local-indicator .icon{width:13px;height:13px}
.publish-button{display:flex;align-items:center;gap:7px;background:linear-gradient(#fdfefe,#e8edf4);border:1px solid #a6b7cd;border-radius:3px;height:26px;padding:0 10px;color:#28578d;white-space:nowrap;font-weight:700;font-size:10px;box-shadow:0 1px 1px #36547112}
.publish-button:hover{background:#dce9f8}
.publish-button span{margin-left:6px;font-size:9px}
.format-toolbar{height:33px;background:linear-gradient(#f5f7f9,#e8ecf1);gap:3px}
.format-toolbar #block-format{width:122px}
.format-toolbar #font-family{width:147px}
.format-toolbar #font-size{width:62px;padding-right:4px}
.format-toolbar .separator{margin:0 4px}
.format-toolbar .tool{width:24px;height:25px}
.format-toolbar .tool .icon{width:15px;height:15px}
.color-tool{position:relative;width:28px;height:25px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:2px;cursor:pointer}
.color-tool:hover{border-color:#9bb6d8;background:#dce8f7}
.color-tool input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.color-tool>.icon{height:18px;width:18px}
.highlight-tool{color:#98791b}
.text-tool{white-space:nowrap;color:#627185;font-size:10px;display:flex;align-items:center;gap:6px;padding:4px}
.text-tool .icon{height:14px;width:14px}
.text-tool:hover{color:#245caa}
.workspace{display:grid;grid-template-columns:64px 202px minmax(280px,1fr) 258px;flex:1;min-height:0;background:var(--chrome)}
.views-rail{background:linear-gradient(90deg,#e6ebf2,#eff2f6);border-right:1px solid #aebacb;display:flex;flex-direction:column;padding-top:8px;gap:4px}
.view-button{height:64px;margin:0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:3px;color:#617286;font-size:9px}
.view-button>.icon{width:24px;height:24px;stroke-width:1.45}
.view-button:hover{background:#e0e9f5;border-color:#bdcde1}
.view-button.active{color:#285f9e;background:linear-gradient(#fbfdff,#d5e2f4);border-color:#9bb4d6;box-shadow:inset 0 1px 1px white}
.rail-bottom{margin-top:auto;display:flex;justify-content:center;padding:13px 0;color:#7d8b9c}
.rail-bottom button{width:32px;height:32px}
.folder-pane{background:#fcfdfe;border-right:1px solid #b0bdcf;display:flex;flex-direction:column;min-width:0;min-height:0}
.pane-heading{height:29px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 10px;background:linear-gradient(var(--pane-top),var(--pane-bottom));border-bottom:1px solid #b5c3d5;color:#3d5574;flex:none}
.pane-heading strong{font-size:11px;font-weight:700}
.pane-heading>div{display:flex}
.pane-heading .tool{height:22px;width:20px;color:#70829a}
.pane-heading .tool .icon{width:13px;height:13px}
.site-root{height:43px;padding:0 12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:11px;white-space:nowrap}
.site-root>.icon{color:#4e8e78;width:18px;height:18px}
.site-root span{overflow:hidden;text-overflow:ellipsis}
.file-search{height:29px;margin:0 10px 8px;position:relative;display:flex;align-items:center}
.file-search>.icon{position:absolute;left:7px;width:12px;height:12px;color:#99a4b2}
.file-search input{width:100%;padding-left:25px;font-size:10px;height:26px;border:1px solid #d8dee6;background:#f7f9fb;outline-offset:0}
.file-tree{flex:1;overflow:auto;padding:4px 5px}
.file-row,.folder-row{width:100%;height:28px;display:flex;align-items:center;text-align:left;gap:6px;white-space:nowrap;border:1px solid transparent;border-radius:2px;color:#56657a;font-size:10px;position:relative}
.file-row span,.folder-row span{overflow:hidden;text-overflow:ellipsis}
.file-row>.icon{width:15px;height:15px;color:#638aaa}
.file-row.css>.icon{color:#98638f}
.file-row.js>.icon{color:#ad8c39}
.file-row.image>.icon{color:#6f9270}
.file-row:hover,.folder-row:hover{background:#edf3fa}
.file-row.active{background:#e2ebf8;color:#274f87;border-color:#c4d5ef;font-weight:700}
.file-row .home-mark{margin-left:auto;color:#7296c2;width:12px;height:12px;margin-right:5px}
.folder-row>.icon{color:#bba565;width:16px;height:16px}
.folder-row .expand-arrow{font-size:8px;color:#8390a2;width:9px;flex:none}
.folder-footer{padding:18px 12px 0;border-top:1px solid #e1e6ed;color:#778698}
.mini-caption{font-size:8px;letter-spacing:1.2px;color:#9ba5b3;margin-bottom:12px}
.folder-footer>button{display:flex;gap:7px;align-items:center;margin-bottom:13px;font-size:10px;color:#607ea5}
.folder-footer>button:hover{color:#275b9e}
.folder-footer>button .icon{width:14px;height:14px}
.local-note{display:flex;align-items:center;gap:5px;font-size:8px;white-space:nowrap;margin:20px -12px 0;padding:12px 10px;background:#f4f7fa;color:#839283;border-top:1px solid #e4e9ee}
.safe-dot{width:5px;height:5px;background:#7ba388;border-radius:50%;display:inline-block;flex:none}
.document-pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:#e9edf3}
.document-tabs{height:33px;flex:none;display:flex;align-items:end;background:#d9e2ee;padding:4px 5px 0;gap:3px;border-bottom:1px solid #aebcd0;overflow:auto}
.document-tab{height:27px;display:flex;align-items:center;gap:7px;background:linear-gradient(#edf2f8,#dfe6ef);border:1px solid #b7c5d8;border-bottom:0;padding:0 8px 0 10px;border-radius:3px 3px 0 0;white-space:nowrap;color:#697a91;font-size:10px;min-width:105px;flex:none;cursor:pointer;outline-offset:-3px}
.document-tab>.icon{height:14px;width:14px;color:#6c8faf}
.document-tab.active{background:#fafbfd;color:#325b93;border-top:2px solid #f0b55c;padding-top:0;height:29px;border-color:#aebed3;border-top-color:#e5ab5d;position:relative;bottom:-1px;font-weight:700}
.document-tab.active>.icon{color:#3f75ac}
.tab-close{margin-left:8px;width:15px;height:15px;display:grid;place-items:center;border-radius:2px;color:#8b98a9}
.tab-close:hover{color:#304860;background:#cddbeb}
.tab-close .icon{width:11px;height:11px}
.tab-add{width:28px;height:27px;color:#72869f;flex:none}
.tab-add .icon{height:14px;width:14px}
.document-toolbar{height:37px;background:#fafbfc;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #cbd4df;flex:none;padding:0 10px;gap:8px}
.document-location{display:flex;align-items:center;gap:6px;min-width:0;font-size:10px;color:#69798c}
.document-location>.icon{width:13px;height:13px;color:#91a4b9}
.document-location>#document-location{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-type-badge{font-size:8px;color:#8a9aaf;border:1px solid #d7dfe9;background:#f1f5f9;padding:2px 4px;border-radius:2px;margin-left:2px;letter-spacing:.5px}
.viewport-tools{display:flex;align-items:center;gap:2px;flex:none}
.device-button{width:25px;height:25px;color:#90a0b1;border:1px solid transparent;border-radius:3px;display:grid;place-items:center}
.device-button>.icon{width:15px;height:15px}
.device-button:hover{background:#edf2f8}
.device-button.active{color:#4171ad;background:#eaf0f9;border-color:#cedcef}
.viewport-tools select{border-color:#d0d9e4;height:23px;font-size:9px;color:#687d95;background:#fff}
.viewport-tools #viewport-width{width:104px;padding-right:4px}
.viewport-tools #zoom-level{width:68px;margin-left:4px;padding-right:4px}
.editor-workspace{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0;position:relative}
.design-stage{position:relative;overflow:auto;flex:1;min-height:0;padding:30px 24px 18px;background-color:var(--workspace);background-image:radial-gradient(#b5bfca7a .65px,transparent .65px);background-size:10px 10px}
.sheet{position:relative;background:#fff;margin:0 auto;box-shadow:0 2px 12px #24395124,0 0 0 1px #bec9d5;isolation:isolate;min-width:200px}
.sheet>iframe{position:absolute;left:0;top:0;border:0;background:#fff;transform-origin:top left;display:block}
.sheet>iframe[hidden]{display:none}
.sheet>canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.horizontal-ruler{position:absolute;left:24px;right:24px;top:0;height:17px;display:flex;align-items:start;overflow:hidden;color:#8d9aae;font:8px Tahoma;pointer-events:none;background:linear-gradient(#e4e9ee,#dbe2e9);border-bottom:1px solid #becad5}
.horizontal-ruler span{position:absolute;top:2px;padding-left:4px;border-left:1px solid #aebdce;height:6px}
.horizontal-ruler:after{content:'';position:absolute;bottom:0;left:0;width:100%;height:3px;background:repeating-linear-gradient(90deg,transparent 0 9px,#b8c4d1 9px 10px)}
.selection-label{position:absolute;z-index:5;background:#3d76ca;color:white;padding:3px 6px;font-family:Tahoma,sans-serif;font-size:9px;line-height:13px;white-space:nowrap;pointer-events:none;border-radius:2px 2px 0 0;box-shadow:0 -1px 3px #16396011}
.resize-handle{position:absolute;width:7px;height:7px;background:#fff;border:1px solid #3d76ca;z-index:6;transform:translate(-50%,-50%);box-shadow:0 0 0 1px #ffffff33}
.resize-handle:hover{background:#bad3fa}
.resize-handle[data-handle=nw],.resize-handle[data-handle=se]{cursor:nwse-resize}
.resize-handle[data-handle=ne],.resize-handle[data-handle=sw]{cursor:nesw-resize}
.resize-handle[data-handle=n],.resize-handle[data-handle=s]{cursor:ns-resize}
.resize-handle[data-handle=e],.resize-handle[data-handle=w]{cursor:ew-resize}
#resize-shield{position:absolute;inset:0;z-index:5;background:transparent}
.preview-notice{position:sticky;bottom:0;width:max-content;margin:8px auto -10px;padding:6px 10px;font-size:9px;border:1px solid #c9d7e7;background:#f7faffed;color:#6480a1;border-radius:3px;box-shadow:0 2px 6px #48648211}
.preview-notice .icon{width:13px;height:13px;margin-right:4px}
.tag-bar{height:25px;background:#f7f9fc;border-top:1px solid #c4cfdd;border-bottom:1px solid #c4cfdd;display:flex;align-items:center;gap:6px;padding:0 9px;flex:none;overflow:hidden}
.tag-caption{font-size:8px;letter-spacing:.8px;display:flex;align-items:center;gap:4px;color:#97a4b5;padding-right:7px;border-right:1px solid #dde3ec}
.tag-caption .icon{width:13px;height:13px}
#tag-path{display:flex;align-items:center;gap:2px;overflow:hidden}
#tag-path button{font:10px Consolas,monospace;color:#7991b0;padding:2px 4px;white-space:nowrap}
#tag-path button:last-child{background:#e2ebf9;color:#3869a7;border-radius:2px}
#tag-path button:hover{background:#dbe6f6}
#tag-path .tag-arrow{color:#b7c1ce;font-size:9px}
#selection-dimensions{margin-left:auto;color:#92a0b2;font-size:9px;white-space:nowrap}
.view-tabs{height:32px;display:flex;justify-content:space-between;align-items:center;flex:none;background:linear-gradient(#f5f7fa,#e8edf4);padding:0 6px;border-bottom:1px solid #bcc8d8}
.mode-tabs{display:flex;height:29px;align-items:center;gap:3px}
.mode-tabs>button{height:25px;display:flex;align-items:center;gap:5px;padding:0 10px;font-size:10px;border:1px solid transparent;color:#6a7e98;border-radius:2px}
.mode-tabs>button>.icon{width:13px;height:13px}
.mode-tabs>button:hover{background:#e1eaf5}
.mode-tabs>button.active{background:linear-gradient(#fff,#e8effa);border-color:#a9bfdb;box-shadow:0 1px 1px #b9c8dc55;color:#285b9b;font-weight:700}
.document-hint{font-size:9px;color:#9aa8ba;padding-right:6px;white-space:nowrap}
.task-pane{border-left:1px solid #b1bfd2;min-width:0;min-height:0;display:flex;flex-direction:column;background:#f9fbfd}
.inspector-tabs{height:36px;display:flex;align-items:stretch;border-bottom:1px solid #d2dbe7;padding:0 7px;gap:0;flex:none;background:#f0f4f9}
.inspector-tabs>button{flex:1;font-size:10px;color:#8796a8;border-bottom:2px solid transparent;padding-top:2px}
.inspector-tabs>button.active{color:#3869a4;font-weight:700;border-bottom-color:#5888c2}
.inspector-tabs>button:hover{color:#305e98;background:#eaf0f8}
.inspector-content{overflow:auto;flex:1;min-height:0;padding-bottom:12px}
.inspector-footer{display:flex;align-items:center;gap:6px;padding:12px 10px;font-size:9px;color:#8d9cab;border-top:1px solid #dfe6ee;background:#f4f7fa;flex:none}
.element-card{padding:15px 12px 12px;border-bottom:1px solid #e1e7ef;background:#fff}
.element-identity{display:flex;align-items:center;gap:9px}
.element-tag{font:12px Consolas,monospace;background:#e9f0fb;color:#507aaf;min-width:34px;height:32px;padding:8px;text-align:center;border:1px solid #dce6f4;border-radius:4px}
.element-name{font-size:11px;font-weight:700;color:#4b6689;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}
.element-subtitle{font-size:9px;color:#a3afbe;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:174px}
.element-actions{display:flex;align-items:center;gap:4px;margin-top:10px}
.element-actions button{height:23px;padding:0 6px;border:1px solid #d8e1ed;border-radius:3px;color:#8a9cb2;background:linear-gradient(#fff,#f2f5fa);font-size:9px;display:flex;align-items:center;gap:4px}
.element-actions button .icon{height:12px;width:12px}
.element-actions button:hover{background:#e8eff9;color:#4872a5}
.element-actions .action-danger{margin-left:auto}
.element-actions .action-danger:hover{background:#fae9e9;color:#c16b6b}
.property-section{padding:0 12px 11px;border-bottom:1px solid #e4e9f0}
.property-heading{font-size:8px;letter-spacing:1.2px;color:#8e9eb2;font-weight:700;margin:14px 0 12px;display:flex;justify-content:space-between}
.property-row{display:grid;grid-template-columns:54px minmax(0,1fr);align-items:center;gap:7px;margin:6px 0;font-size:9px;color:#8797aa}
.property-row>input,.property-row>select{height:24px;width:100%;font-size:10px;color:#5d738e;border-color:#d8e1eb;border-radius:3px;background:#fff;padding-left:7px;min-width:0}
.property-row input::placeholder{color:#a7b3c2}
.property-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.property-pair .property-row{grid-template-columns:30px 1fr;gap:4px}
.property-pair input{width:100%;min-width:0}
.property-color{display:flex;gap:5px}
.property-color input[type=color]{width:26px;height:24px;flex:none;border-color:#d8e1eb;border-radius:3px;padding:3px}
.property-color input[type=text]{width:100%;min-width:0;height:24px;border-color:#d8e1eb;font-size:10px;color:#7890af}
.box-model{margin:12px 0 4px;border:1px dashed #d9c7a4;background:#f8f2e6;text-align:center;position:relative;padding:15px 20px;color:#b4a07a;font-size:8px}
.box-model .box-label{position:absolute;top:3px;left:5px;letter-spacing:.3px}
.padding-box{border:1px dashed #b9cbae;background:#edf4e8;padding:15px 16px;position:relative;color:#8ba175}
.content-box{background:#e4edf9;border:1px solid #b8cdea;padding:9px 0;font:9px Consolas,monospace;color:#7b9ec7;white-space:nowrap}
.box-top{position:absolute;top:3px;left:50%;transform:translateX(-50%)}
.box-bottom{position:absolute;bottom:3px;left:50%;transform:translateX(-50%)}
.box-left{position:absolute;left:5px;top:50%;transform:translateY(-50%)}
.box-right{position:absolute;right:5px;top:50%;transform:translateY(-50%)}
.panel-description{font-size:10px;line-height:1.6;color:#91a0b3;margin:13px 12px}
.insert-grid{padding:0 10px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.component-tile{height:69px;background:#fff;border:1px solid #dae3ef;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;border-radius:4px;font-size:9px;color:#8296b1;transition:background .12s,border-color .12s}
.component-tile .icon{height:23px;width:23px;stroke-width:1.3}
.component-tile:hover{background:#edf4fd;border-color:#abc4e6;color:#3a72b6}
.insert-group-heading{font-size:8px;letter-spacing:1px;color:#93a3b9;margin:16px 12px 9px;text-transform:uppercase;font-weight:700}

    else if(this.view==='reports'){content=stats+`<div class="report-section-title">${report.issues.length?report.issues.length+' items to review':'All checks passed'}</div>`+(report.issues.length?`<table class="data-table"><thead><tr><th>Type</th><th>Page</th><th>Finding</th></tr></thead><tbody>${report.issues.map(i=>`<tr><td><span class="issue-badge ${i.severity==='error'?'error':''}">${icon('warning')}${cap(i.severity)}</span></td><td><button data-issue-path="${escapeHTML(i.path)}">${escapeHTML(i.path)}</button></td><td>${escapeHTML(i.detail)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty-state">${icon('check')}No missing local resources or issues in the checks performed.</div>`)+`<p class="table-note">This is a heuristic local audit, not a complete HTML or WCAG validator. External URLs, network responses, JavaScript behavior, CSS assets, and complex srcset rules are not fully validated.</p>`;}
    else if(this.view==='navigation'){const home=report.pages.find(p=>p.path==='index.html')||report.pages[0];const card=p=>`<button class="sitemap-node" data-file="${escapeHTML(p.path)}">${icon(p.path===home.path?'home':'page')}<span>${escapeHTML(p.path)}</span><small>${escapeHTML(p.title.slice(0,40))}</small></button>`;content=home?`<div class="sitemap"><div class="sitemap-root" style="width:150px">${card(home)}</div><div class="sitemap-children">${report.pages.filter(p=>p!==home).map(card).join('')}</div></div><p class="table-note">${report.pages.length} pages · ${report.links.filter(l=>l.target).length} local hyperlinks. This inventory does not imply a parent-child routing hierarchy.</p>`:'<div class="empty-state">Create an HTML page to build your website navigation.</div>';}
    else if(this.view==='hyperlinks'){content=`<div class="link-groups">${report.pages.map(p=>`<div class="link-group"><h3>${icon('page')} ${escapeHTML(p.path)}</h3>${report.links.filter(l=>l.from===p.path).map(l=>`<button class="${l.broken?'broken':''}" ${l.target&&this.model.get(l.target)?`data-file="${escapeHTML(l.target)}"`:`data-issue-path="${escapeHTML(l.from)}"`} title="${escapeHTML(l.raw)}">${icon(l.broken?'warning':l.external?'external':'link')}<span>${escapeHTML(l.raw)}</span></button>`).join('')||'<p class="panel-description">No links on this page.</p>'}</div>`).join('')}</div>`;}
    else if(this.view==='tasks'){content=`<div class="task-input"><input id="new-task-input" placeholder="Add something to do…" aria-label="New task"><button class="primary-button" data-cmd="add-task">${icon('plus')} Add task</button></div><div class="task-list">${this.model.data.tasks.map(t=>`<label class="task-item ${t.done?'done':''}"><input type="checkbox" data-task-id="${escapeHTML(t.id)}" ${t.done?'checked':''}><span>${escapeHTML(t.text)}</span><button type="button" data-delete-task="${escapeHTML(t.id)}" aria-label="Delete task">${icon('close')}</button></label>`).join('')||'<div class="empty-state">Nothing on the list. Add a task above.</div>'}</div><p class="table-note">${this.model.data.tasks.filter(t=>t.done).length} of ${this.model.data.tasks.length} tasks complete. Tasks are saved in your project backup, not exported to the website.</p>`;}
    else{content=stats+`<div class="website-card"><div><h2>${escapeHTML(this.model.data.name)}</h2><p>Design visually. Fine-tune the source. Preview on any screen. Everything you create is ordinary web code, ready to go anywhere.</p><div class="website-actions"><button class="primary-button" data-file="${escapeHTML(report.pages[0]?.path||this.model.active.path)}">${icon('design')} Edit website</button><button class="secondary-button" data-cmd="publish">${icon('export')} Export site</button></div></div>${this.model.get('assets/pavilion.svg')?`<img src="${this.runtime.asset('assets/pavilion.svg')}" alt="Sample website architecture illustration">`:'<div class="empty-state">'+icon('globe')+'Your next great website.</div>'}</div><div class="report-section-title">A familiar workflow, without the baggage.</div><p class="table-note">Your workspace is stored locally using ${this.store.backend}. Export a .pageforge project for a portable backup, or a website ZIP to publish to a static host. Imported scripts run only in the isolated Preview view.</p>`;}
    root.innerHTML=header+content;if(this.view==='tasks')$('#new-task-input')?.addEventListener('keydown',e=>{if(e.key==='Enter')this.addTask();});}
  addTask(){const input=$('#new-task-input'),text=input?.value.trim();if(!text)return;this.model.data.tasks.push({id:globalThis.crypto?.randomUUID?.()||String(Date.now()),text:text.slice(0,500),done:false});this.touch('Add task');this.renderSiteView();$('#new-task-input')?.focus();}
  openMenu(button){const name=button.dataset.menu,root=$('#dropdown-menu');if(!root.hidden&&root.dataset.openMenu===name){this.closeMenu();return;}this.closeMenu();button.classList.add('open');button.setAttribute('aria-expanded','true');const menus={
    File:[['new','New page or file…','page','Ctrl+N'],['import','Open / import…','folderOpen','Ctrl+O'],null,['save','Save locally','save','Ctrl+S'],['save-project','Save project backup…','save'],['export-file','Export current file…','export'],['export-site','Export website ZIP…','globe'],null,['rename','Rename current file…','rename'],['delete-file','Delete current file…','trash'],null,['page-properties','Page properties…','settings']],
    Edit:[['undo','Undo','undo','Ctrl+Z'],['redo','Redo','redo','Ctrl+Shift+Z'],null,['cut','Cut','cut'],['copy','Copy','copy'],['paste','Paste','paste'],null,['select-all','Select all','section'],['duplicate','Duplicate element','copy','Ctrl+D'],['delete-element','Delete element','trash'],null,['find','Find and replace…','search','Ctrl+F']],
    View:[['design','Design','design'],['split','Split','split'],['code','Code','code'],['preview','Preview','preview','F5'],null,['toggle-folders','Folder list','folder'],['toggle-inspector','Task pane','layers'],['boundaries','Element boundaries','grid'],['grid','Layout grid','grid'],null,['folders','Website folders','folderOpen'],['navigation','Navigation','navigation'],['hyperlinks','Hyperlinks','link']],
    Insert:[['new','New page…','page'],['link','Hyperlink…','link','Ctrl+K'],['image','Image…','image'],['table','Table…','table'],null,['insert-heading','Heading','heading'],['insert-paragraph','Paragraph','paragraph'],['insert-divider','Horizontal line','divider'],['insert-form','Contact form','form'],null,['html','HTML fragment…','code'],['component','Component library','columns']],
    Format:[['bold','Bold','bold','Ctrl+B'],['italic','Italic','italic','Ctrl+I'],['underline','Underline','underline','Ctrl+U'],null,['left','Align left','left'],['center','Center','center'],['right','Align right','right'],['justify','Justify','justify'],null,['ul','Bulleted list','list'],['ol','Numbered list','ordered'],['clear','Clear formatting','clear'],['format-code','Format HTML source','code']],
    Table:[['table','Insert table…','table'],null,['table-row','Insert row after selection','plus'],['table-column','Insert column after selection','columns'],null,['table-delete-row','Delete selected row','trash'],['table-delete-column','Delete selected column','trash']],
    Tools:[['reports','Website reports','reports'],['hyperlinks','Check local hyperlinks','link'],['tasks','Website tasks','tasks'],null,['page-properties','Page properties…','settings'],['settings','Preferences…','settings'],null,['publish','Export for publishing…','globe']],
    Window:[['next-tab','Next document','page'],['close-tab','Close document tab','close'],null,['reset-layout','Reset workspace layout','design']],
    Help:[['help','PageForge guide','help','F1'],['shortcuts','Keyboard shortcuts','terminal'],['about','About PageForge Studio','globe'],null,['reset-demo','Restore sample website…','refresh']]
    };root.innerHTML=(menus[name]||[]).map(item=>item?`<button class="menu-item" role="menuitem" data-cmd="${item[0]}">${icon(item[2])}<span>${item[1]}</span><span class="menu-key">${item[3]||''}</span></button>`:'<div class="menu-divider"></div>').join('');const r=button.getBoundingClientRect();root.style.left=Math.min(r.left,window.innerWidth-260)+'px';root.style.top=r.bottom+'px';root.dataset.openMenu=name;root.hidden=false;}
  closeMenu(){$('#dropdown-menu').hidden=true;$$('[data-menu].open').forEach(b=>{b.classList.remove('open');b.setAttribute('aria-expanded','false');});}
  async settingsDialog(){const result=await this.modal('Preferences',`<label class="field">Workspace appearance<select name="theme"><option value="blue" ${this.settings.theme==='blue'?'selected':''}>Classic Blue</option><option value="silver" ${this.settings.theme==='silver'?'selected':''}>Classic Silver</option></select></label><label class="checkbox-label"><input type="checkbox" name="autosave" ${this.settings.autosave?'checked':''}> Save changes automatically in this browser</label><label class="checkbox-label" style="margin-top:12px"><input type="checkbox" name="spellcheck" ${this.settings.spellcheck?'checked':''}> Native spell checking in Design view</label><p class="modal-note">Storage: ${this.store.backend}<br>Renderer: ${this.renderer.mode}<br>WebGPU overlays use native HTML layout. The renderer falls back automatically when a GPU adapter is unavailable.</p>`,{ok:'Save preferences'});if(!result)return;this.settings={theme:result.theme,autosave:!!result.autosave,spellcheck:!!result.spellcheck};document.body.dataset.theme=this.settings.theme;try{localStorage.setItem('pageforge-settings',JSON.stringify(this.settings));}catch{}if(this.editor.doc)this.editor.doc.body.spellcheck=this.settings.spellcheck;if(this.settings.autosave){this.autosavePaused=false;this.scheduleSave();}this.toast('Preferences saved');}
  async helpDialog(){await this.modal('Welcome to PageForge Studio',`<div class="brand-about"><span class="app-logo">${icon('page')}</span><div><strong>Make the web yours.</strong><small>A familiar website editor, reimagined.</small></div></div><div class="help-step"><strong>1. Start with a page</strong>Open a file in Folder List. Use File → New to create a blank, studio, or landing page. Import ordinary HTML, CSS, JavaScript, images, ZIP websites, or .pageforge backups.</div><div class="help-step"><strong>2. Design directly on the page</strong>Click text and type. Select text to format it. The Properties pane edits CSS and attributes. Insert contains draggable building blocks. Layers selects and reorders the DOM.</div><div class="help-step"><strong>3. Get close to the code</strong>Use Split or Code for source editing. The source editor includes syntax highlighting, line numbers, find/replace, Tab indentation, and HTML formatting.</div><div class="help-step"><strong>4. Check every screen</strong>Switch among desktop, tablet, and phone widths. Preview executes your local JavaScript in a sandbox. Internal page links navigate your project.</div><div class="help-step"><strong>5. Save it. Ship it.</strong>Changes save in this browser. File → Save project backup downloads an editable backup. Publish website exports standard files in a ZIP for your preferred host.</div><p class="modal-note">Design view normalizes HTML through the browser’s parser. It is not a byte-preserving source editor. Scripts are disabled in Design. Preview cannot access your editor’s storage, issue fetch requests, or submit forms to a server.</p>`,{ok:'Start creating',cancel:null,width:580});}
  async shortcutsDialog(){await this.modal('Keyboard shortcuts',`<table class="keyboard-table">${[['Save project locally','Ctrl / ⌘ + S'],['New file','Ctrl / ⌘ + N'],['Import files','Ctrl / ⌘ + O'],['Undo','Ctrl / ⌘ + Z'],['Redo','Ctrl / ⌘ + Shift + Z'],['Bold / italic / underline','Ctrl / ⌘ + B / I / U'],['Insert hyperlink','Ctrl / ⌘ + K'],['Find and replace','Ctrl / ⌘ + F'],['Toggle preview','Ctrl / ⌘ + Enter'],['Preview','F5'],['Select parent element','Esc (in Design)'],['Next table cell','Tab (in table)'],['Indent source line','Tab (in Code)'],['Open linked project page','Ctrl / ⌘ + click (in Design)']].map(([a,b])=>`<tr><td>${a}</td><td><span class="shortcut">${b}</span></td></tr>`).join('')}</table>`,{ok:'Done',cancel:null,width:590});}
  async aboutDialog(){await this.modal('About PageForge Studio',`<div class="brand-about"><span class="app-logo">${icon('page')}</span><div><strong>PageForge Studio</strong><small>Version ${APP_VERSION} · independent implementation</small></div></div><p>A FrontPage-inspired, local-first visual website editor built with plain HTML, CSS, and JavaScript.</p><p><strong>Rendering:</strong> Native browser DOM, CSS layout, typography, selection, and input. WebGPU renders editor overlays using instanced WGSL rectangles, with a Canvas 2D fallback.</p><p><strong>Current renderer:</strong> ${this.renderer.mode}<br><strong>Storage:</strong> ${this.store.backend}<br><strong>Runtime dependencies:</strong> None</p><p class="modal-note">This project is not affiliated with Microsoft. It does not implement FrontPage Server Extensions, ASP/database wizards, collaborative editing, or FTP publishing. It exports ordinary modern static websites.</p>`,{ok:'Done',cancel:null,width:520});}
  async resetDemo(){const result=await this.modal('Restore sample website',`<p>Replace the current workspace with the Monograph Studio sample?</p><p class="modal-note">This replaces the current project. Export a .pageforge backup first to keep your work.</p>`,{ok:'Restore sample'});if(result)await this.replaceProject(starterProject());}
}
new PageForgeApp().init().catch(error=>{console.error(error);const panel=document.createElement('div');panel.style.cssText='position:fixed;inset:20%;z-index:999;background:white;padding:32px;border:1px solid #b77;font:14px/1.6 system-ui';panel.innerHTML='<h1>PageForge could not start</h1><p>'+escapeHTML(error.message)+'</p><p>Try a recent browser or serve this file from localhost.</p>';document.body.append(panel);});


})();</script></body></html>
